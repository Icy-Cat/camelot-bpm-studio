<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="vinylGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 12 Camelot Wheel Segments -->
  <g transform="translate(256, 256)">
    <!-- Segments 1 through 12 -->
    <path d="M 0 -235 A 235 235 0 0 1 117.5 -203.5 L 92.5 -160.2 A 185 185 0 0 0 0 -185 Z" fill="#00c8b4" />
    <path d="M 117.5 -203.5 A 235 235 0 0 1 203.5 -117.5 L 160.2 -92.5 A 185 185 0 0 0 92.5 -160.2 Z" fill="#00b4f0" />
    <path d="M 203.5 -117.5 A 235 235 0 0 1 235 0 L 185 0 A 185 185 0 0 0 160.2 -92.5 Z" fill="#2882ff" />
    <path d="M 235 0 A 235 235 0 0 1 203.5 117.5 L 160.2 92.5 A 185 185 0 0 0 185 0 Z" fill="#6e50ff" />
    <path d="M 203.5 117.5 A 235 235 0 0 1 117.5 203.5 L 92.5 160.2 A 185 185 0 0 0 160.2 92.5 Z" fill="#aa3cf0" />
    <path d="M 117.5 203.5 A 235 235 0 0 1 0 235 L 0 185 A 185 185 0 0 0 92.5 160.2 Z" fill="#e628b4" />
    <path d="M 0 235 A 235 235 0 0 1 -117.5 203.5 L -92.5 160.2 A 185 185 0 0 0 0 185 Z" fill="#f0325a" />
    <path d="M -117.5 203.5 A 235 235 0 0 1 -203.5 117.5 L -160.2 92.5 A 185 185 0 0 0 -92.5 160.2 Z" fill="#f55a28" />
    <path d="M -203.5 117.5 A 235 235 0 0 1 -235 0 L -185 0 A 185 185 0 0 0 -160.2 92.5 Z" fill="#fa961e" />
    <path d="M -235 0 A 235 235 0 0 1 -203.5 -117.5 L -160.2 -92.5 A 185 185 0 0 0 -185 0 Z" fill="#f5d228" />
    <path d="M -203.5 -117.5 A 235 235 0 0 1 -117.5 -203.5 L -92.5 -160.2 A 185 185 0 0 0 -160.2 -92.5 Z" fill="#96dc32" />
    <path d="M -117.5 -203.5 A 235 235 0 0 1 0 -235 L 0 -185 A 185 185 0 0 0 -92.5 -160.2 Z" fill="#28d26e" />

    <!-- Separator lines between Camelot segments -->
    <g stroke="#0f172a" stroke-width="5">
      <line x1="0" y1="-185" x2="0" y2="-235" />
      <line x1="92.5" y1="-160.2" x2="117.5" y2="-203.5" />
      <line x1="160.2" y1="-92.5" x2="203.5" y2="-117.5" />
      <line x1="185" y1="0" x2="235" y2="0" />
      <line x1="160.2" y1="92.5" x2="203.5" y2="117.5" />
      <line x1="92.5" y1="160.2" x2="117.5" y2="203.5" />
      <line x1="0" y1="185" x2="0" y2="235" />
      <line x1="-92.5" y1="160.2" x2="-117.5" y2="203.5" />
      <line x1="-160.2" y1="92.5" x2="-203.5" y2="117.5" />
      <line x1="-185" y1="0" x2="-235" y2="0" />
      <line x1="-160.2" y1="-92.5" x2="-203.5" y2="-117.5" />
      <line x1="-92.5" y1="-160.2" x2="-117.5" y2="-203.5" />
    </g>

    <!-- Vinyl Record Center Disc -->
    <circle cx="0" cy="0" r="176" fill="url(#vinylGlow)" stroke="#334155" stroke-width="4" />
    <!-- Grooves -->
    <circle cx="0" cy="0" r="155" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 4" />
    <circle cx="0" cy="0" r="135" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="12 6" />

    <!-- Center Spindle Label -->
    <circle cx="0" cy="0" r="88" fill="#1e293b" stroke="#475569" stroke-width="3" />

    <!-- Audio Waveform Bars in Center -->
    <g transform="translate(-56, 0)">
      <rect x="0" y="-20" width="8" height="40" rx="4" fill="#00c8b4" filter="url(#glow)" />
      <rect x="16" y="-36" width="8" height="72" rx="4" fill="#2882ff" filter="url(#glow)" />
      <rect x="32" y="-54" width="8" height="108" rx="4" fill="#aa3cf0" filter="url(#glow)" />
      <rect x="48" y="-32" width="8" height="64" rx="4" fill="#f55a28" filter="url(#glow)" />
      <rect x="64" y="-48" width="8" height="96" rx="4" fill="#fa961e" filter="url(#glow)" />
      <rect x="80" y="-58" width="8" height="116" rx="4" fill="#f5d228" filter="url(#glow)" />
      <rect x="96" y="-42" width="8" height="84" rx="4" fill="#28d26e" filter="url(#glow)" />
      <rect x="112" y="-24" width="8" height="48" rx="4" fill="#00b4f0" filter="url(#glow)" />
    </g>

    <!-- Turntable Spindle Center Hole -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" />
    <circle cx="0" cy="0" r="5" fill="#0f172a" />
  </g>
</svg>
